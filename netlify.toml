[build]
  # Builds both apps, in this order for two reasons that both matter:
  #   1. the યુવક build owns dist/ and empties it, which would wipe dist/admin if it
  #      ran second;
  #   2. its service worker precaches by globbing dist/, so building the panel
  #      afterwards keeps admin chunks out of the yuvak's precache manifest.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # No `external_node_modules`. It used to list sharp, whose compiled native binary esbuild
  # cannot bundle, for the image-publishing function — which no longer exists: દર્શન images
  # are served straight from Google's CDN and nothing on the server touches image bytes.
  # The two remaining functions are plain fetch and JSON.

# Short, stable paths for the client; the function files can be renamed freely.
[[redirects]]
  from = "/api/login-mobile"
  to = "/.netlify/functions/login-mobile"
  status = 200

# Appointing a સંચાલક. Creating somebody else's auth.users row needs the secret key, so the
# panel cannot do it itself — see the function's own note for why the admins row that follows
# is written with the caller's token and not that key.
[[redirects]]
  from = "/api/create-admin"
  to = "/.netlify/functions/create-admin"
  status = 200

# Deleting a test યુવક. The database removes the data (it is the only thing that can check the
# caller may, and that the account is really a test one); this removes the GoTrue login, which
# lives in a schema the application does not own.
[[redirects]]
  from = "/api/purge-test-account"
  to = "/.netlify/functions/purge-test-account"
  status = 200


# The web app manifest, served by netlify/functions/manifest.js instead of as the static file
# vite-plugin-pwa builds into dist/. The icon in it comes from settings['app'].appIcon, so the
# સંચાલક can change the mark on two thousand home screens without a redeploy — Chrome re-fetches
# this URL roughly once a day for every installed Android app and mints an updated WebAPK when
# the icon differs. A static manifest can never differ from itself, which is the whole reason
# this rule exists.
#
# DO NOT REMOVE `force = true`. It is not redundant and it is not defensive habit.
#
# Netlify serves static files BEFORE it consults redirects, and `npm run build` really does
# produce dist/manifest.webmanifest — vite-plugin-pwa writes it on every build, from the
# `manifest` block in vite.config.js. Netlify's own documentation states the rule and the
# exception: "By default, you can't
# shadow a URL that actually exists within the site… If you're 100% sure that you'll always want
# to redirect, even when the URL matches a static file, you can append an exclamation mark to
# the rule" (Redirects → Rewrites and proxies → Shadowing). `force = true` in TOML is that
# exclamation mark; `force` is documented as "whether to override any existing content in the
# path or not; false by default".
#
# So without it this rule never fires even once. The static file is served, the manifest is
# frozen at build time, and the icon setting becomes a control that reports "Saved" while every
# installed Android phone keeps the old mark indefinitely — with nothing failing, nothing logged
# and no way to tell from the panel.
[[redirects]]
  from = "/manifest.webmanifest"
  to = "/.netlify/functions/manifest"
  status = 200
  force = true

# સંચાલક પેનલ — its own SPA, its own fallback, and it MUST come before the yuvak
# catch-all below.
#
# /admin/ itself resolves as a real file (dist/admin/index.html) because Netlify serves
# static files before consulting redirects. Deep links do not: /admin/users matches no
# file, so without this rule it would fall through to /* and Netlify would hand back the
# યુવક shell for an admin URL — a yuvak app booting at an /admin path, which then
# redirects to '/' and looks like the panel silently refusing to open.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# SPA fallback — must come after the API and /admin rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caching is declared in public/_headers, which Netlify reads directly.
# Image filenames embed a content hash, so they can be immutable; the shell cannot.
