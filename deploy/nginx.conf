# વર્ણી ધ્યાન — the site's one server block.
# Copied to /etc/nginx/http.d/default.conf by the `app` stage of the Dockerfile, and included
# from the http block of deploy/nginx-main.conf.
#
# ════════════════════════════════════════════════════════════════════════════════════════════
# WHAT THIS FILE IS A TRANSLATION OF
# ════════════════════════════════════════════════════════════════════════════════════════════
#
# Every rule below restates one line of netlify.toml or public/_headers, and says which. That
# is the whole design brief: the ~2,000 યુવકો using this app must not be able to tell which
# host answered. Where nginx and Netlify genuinely cannot agree, the difference is written out
# in a comment rather than left to be discovered — there are exactly two, and both are marked
# DIFFERS FROM NETLIFY.
#
# Verified against https://varni-dhyan.netlify.app before this file was written:
#
#   /                  200  Cache-Control: public,max-age=0,must-revalidate
#   /admin             301  Location: /admin/
#   /admin/            200  X-Frame-Options: DENY, Referrer-Policy: same-origin,
#                           X-Robots-Tag: noindex, nofollow, public,max-age=0,must-revalidate
#   /admin/users       200  the same four headers  (the SPA fallback)
#   /assets/<hashed>   200  public,max-age=31536000,immutable
#   /sw.js             200  public,max-age=0,must-revalidate
#   /registerSW.js     200  public,max-age=0,must-revalidate
#   /favicon.svg       200  public,max-age=0,must-revalidate
#   /nope-deep/route   200  text/html  (the SPA fallback)
#   GET /api/login-mobile  405  application/json  (the function, refusing a non-POST)
#
# ════════════════════════════════════════════════════════════════════════════════════════════
# NGINX LOCATION PRIORITY, BECAUSE THREE RULES HERE DEPEND ON IT
# ════════════════════════════════════════════════════════════════════════════════════════════
#
#   1. `location = /path`   exact — beats everything
#   2. `location ^~ /pre/`  prefix, and skips regex matching if it wins
#   3. `location ~ …`       regex, in file order
#   4. `location /pre/`     plain prefix, longest wins
#
# It matters here three times:
#
#   * `= /manifest.webmanifest` must beat the real file at that path in dist/. This is the
#     nginx spelling of `force = true` in netlify.toml, and it is load-bearing for the same
#     reason: vite-plugin-pwa writes dist/manifest.webmanifest on every build, and if the
#     static file wins, the app icon is frozen at build time and no સંચાલક can ever change
#     the mark on an installed Android home screen. netlify/functions/manifest.js explains the
#     whole WebAPK mechanism.
#   * `^~ /admin/assets/` must beat `^~ /admin/`, so the panel's hashed chunks are immutable
#     while its shell is not. Longer prefix wins; both are `^~`.
#   * `^~ /.netlify/functions/` must beat the dotfile deny below it. A `^~` win skips regex
#     matching entirely, which is exactly what is wanted: that one dotted path is a real
#     endpoint and every other dotted path is not.

# ── the function server ──────────────────────────────────────────────────────────────────────
#
# 127.0.0.1:8888, inside this same container. deploy/entrypoint.sh starts it; the Dockerfile
# sets HOST=127.0.0.1 so it binds loopback and nothing else.
#
# NO `resolver` DIRECTIVE, AND NONE IS NEEDED. That is worth stating because it was needed in
# the two-container layout and its absence looks like an omission: there, the upstream was the
# service name `api`, Docker's embedded DNS handed out a new address whenever that container was
# recreated, and an `upstream` block would have cached the old one for the life of the nginx
# process — 502 on every login after a deploy, with nothing in the logs naming the cause.
#
# A literal IP cannot go stale, so the whole problem disappears when the two halves share a
# container. `$request_uri` in proxy_pass is still a variable, but nginx only requires a resolver
# when the HOST part is one.
#
# The address is written into deploy/api-proxy.inc, which the three proxied locations include.

# Netlify does not advertise its version and neither should this.
server_tokens off;

# ── compression ──────────────────────────────────────────────────────────────────────────────
#
# `gzip_static on` serves the .gz twins the builder wrote with gzip -9 — level 9 paid once at
# build time instead of level 6 paid per request. `gzip on` is the fallback for anything with
# no twin. Neither changes what a client that did not send Accept-Encoding receives.
gzip_static on;
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml;

# NOTE ON .webmanifest AND WHY THERE IS NO `types` BLOCK HERE.
#
# nginx's bundled mime.types has no entry for .webmanifest, so the static dist/manifest.webmanifest
# would be served as application/octet-stream — which is, as it happens, exactly what Netlify
# does today. It does not matter: the exact-match location below proxies that URL to
# netlify/functions/manifest.js, which sets `Content-Type: application/manifest+json` itself.
#
# The tempting fix is a `types { application/manifest+json webmanifest; }` block here. Do not
# add one. A second `types` block in the same context REPLACES the whole map that
# `include /etc/nginx/mime.types` established in the main config — so it would fix one
# extension and serve every .js, .css and .png in both apps as application/octet-stream. If the
# static file ever does need the right type, spell it as `default_type` inside a location.

# Netlify caps a function request body at 6 MB; server/node-server.js applies the same ceiling.
# Rejecting an over-large body here means it never reaches the function server at all.
client_max_body_size 6m;
client_body_timeout 15s;
client_header_timeout 15s;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── relative Location headers ─────────────────────────────────────────────────────────────
  #
  # NOT COSMETIC, AND NOT ONLY FOR PARITY WITH NETLIFY.
  #
  # nginx's default is `absolute_redirect on`, which builds a redirect target out of $host and
  # the scheme nginx itself is serving — and this server is serving plain HTTP behind a TLS
  # edge. So the 301 on /admin below would answer `Location: http://YOUR_DOMAIN/admin/`: a
  # downgrade to plaintext, corrected only by Caddy redirecting it back up, at the cost of two
  # extra round trips on the one URL a સંચાલક types by hand.
  #
  # `off` emits `Location: /admin/`, which the browser resolves against the scheme and host it
  # already has. That is also exactly what Netlify sends today (verified above).
  absolute_redirect off;

  # Straight to the container's stdout and stderr, so `docker compose logs app` is the whole
  # story — both halves interleaved — and nothing accumulates on the VPS's disk. Rotation is
  # configured on the Docker daemon instead; deploy/vps-setup.sh sets max-size and max-file.
  #
  # `main` is the format defined in deploy/nginx-main.conf, and it logs no request body and no
  # header. That is deliberate and stated in both files: /api/login-mobile receives a password
  # on every mobile login, and three of the five functions receive a bearer token.
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # ── health ────────────────────────────────────────────────────────────────────────────────
  #
  # Answered by nginx itself: no filesystem, no upstream, no Supabase. It reports "this
  # container is serving", which is the only claim a restart policy or a deploy gate should
  # act on. deploy/health-check.sh checks the real surfaces separately.
  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # ── /manifest.webmanifest → the function ──────────────────────────────────────────────────
  #
  # netlify.toml, the rule carrying `force = true`. See the priority note at the top of this
  # file for why an exact-match location is the only spelling that works, and
  # netlify/functions/manifest.js for what breaks if it stops working: an installed Android
  # app is a WebAPK, Chrome compares this URL with the package on the phone about once a day,
  # and a static manifest can never differ from itself.
  #
  # The function sets its own Content-Type (application/manifest+json) and Cache-Control
  # (public, max-age=300, must-revalidate); both are passed through untouched.
  location = /manifest.webmanifest {
    proxy_pass http://127.0.0.1:8888$request_uri;
    include /etc/nginx/http.d/api-proxy.inc;
  }

  # ── /api/* → the functions ────────────────────────────────────────────────────────────────
  #
  # The three redirects in netlify.toml. server/node-server.js answers exactly those three
  # paths and 404s anything else under /api/, so this prefix does not widen the surface — it
  # only means an unknown /api path gets a JSON 404 from the function server rather than the
  # યુવક app shell, which is the right answer for a path the client treats as an API.
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8888$request_uri;
    include /etc/nginx/http.d/api-proxy.inc;
  }

  # ── /.netlify/functions/* → the functions ─────────────────────────────────────────────────
  #
  # Netlify's own path for a bundled function, and it is not legacy plumbing:
  # admin/src/features/darshan/services/importService.js calls
  # `/.netlify/functions/list-drive-folder` literally, with a comment saying it deliberately
  # uses no `/api/…` alias. Removing this breaks the bulk દર્શન importer and nothing else,
  # which is the kind of breakage that is found months later.
  location ^~ /.netlify/functions/ {
    proxy_pass http://127.0.0.1:8888$request_uri;
    include /etc/nginx/http.d/api-proxy.inc;
  }

  # The body the three proxied locations fall back to when the api container cannot be reached
  # — see the error_page note in deploy/api-proxy.inc. Same shape and same Gujarati sentence
  # every handler already returns for an unexpected failure, so a caller reading the `gu` field
  # gets a sentence to show instead of an HTML page it cannot parse.
  location @api_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"code":"server-error","gu":"કંઈક ગડબડ થઈ. ફરી પ્રયત્ન કરો."}';
  }

  # ── hashed assets, both apps ──────────────────────────────────────────────────────────────
  #
  # public/_headers: `/assets/*` and `/admin/assets/*`, Cache-Control immutable for a year.
  # Safe because every filename in these two directories carries a content hash, so a changed
  # file is a changed URL and a cached one can never be wrong.
  #
  # `/admin/assets/` is the longer prefix and therefore beats `/admin/` below; it repeats that
  # block's four headers because `add_header` in a location REPLACES everything inherited
  # rather than adding to it — the single most common way an nginx config silently drops a
  # security header.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    # DIFFERS FROM NETLIFY (1 of 2). A hashed asset that does not exist gets a 404 here;
    # Netlify's `/*` catch-all hands back index.html with 200 and a text/html body. Both are a
    # failure for a browser expecting JavaScript, but a 404 is one a client can recognise —
    # and an HTML body served as a module is the classic "white screen after a deploy while
    # someone had a stale tab open". Any asset that exists is served identically.
    try_files $uri =404;
  }

  location ^~ /admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # ── the સંચાલક પેનલ ────────────────────────────────────────────────────────────────────────
  #
  # Netlify 301s /admin to /admin/ (verified above). The panel's BrowserRouter uses
  # basename="/admin" and every asset path in dist/admin/index.html is root-absolute, so it
  # would in fact boot at either URL — but production redirects today and this preserves that
  # rather than quietly introducing a second canonical address for the console.
  location = /admin {
    return 301 /admin/;
  }

  # netlify.toml: `/admin/* → /admin/index.html, status = 200`, and it MUST come before the
  # yuvak catch-all. Without it, /admin/users falls through to /* and Netlify hands back the
  # યુવક shell for an admin URL — a yuvak app booting at an /admin path, which redirects to
  # '/' and looks exactly like the panel refusing to open.
  #
  # The three protections are public/_headers' `/admin/*` block, and the comment there is
  # worth repeating: they must not depend on how the panel was reached. The panel is the one
  # surface that can suspend an account, read two thousand mobile numbers and grant
  # SUPER_ADMIN.
  #
  # Cache-Control is `public, max-age=0, must-revalidate` and not the `private, …` that
  # public/_headers declares for the literal path /admin/index.html. That rule matches the
  # request path, so on Netlify it covers the one URL nobody types and none of the URLs a
  # સંચાલક opens; /admin/ and /admin/users both answer `public,max-age=0,must-revalidate`
  # today. This preserves what production actually sends.
  location ^~ /admin/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri /admin/index.html;
  }

  # ── the service worker, and the script that registers it ──────────────────────────────────
  #
  # public/_headers: `/sw.js`, max-age=0, must-revalidate. This is the file that decides which
  # version of the app every installed phone runs, so a cached copy is a deploy that never
  # arrives. registerSW.js carries no hash either and is referenced from index.html by a bare
  # path; Netlify's default for it is the same max-age=0, must-revalidate (verified above).
  #
  # workbox-<hash>.js is NOT listed here on purpose: it is hashed, sw.js imports it by that
  # hashed name, and it falls to the catch-all below, which is what Netlify does with it too.
  location = /sw.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    # A service worker may control no wider a path than the one it is served from, and this one
    # claims '/'. Serving it from the root is what makes that legal; nothing extra is needed.
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # ── /.well-known/ ─────────────────────────────────────────────────────────────────────────
  #
  # Nothing lives here today and this answers 404, same as Netlify. It is declared as a `^~`
  # prefix purely so it wins over the dotfile refusal below: /.well-known/ is where an ACME
  # http-01 challenge, a security.txt or an apple-app-site-association would go, and a config
  # that blanket-404s it is a config someone has to debug at the moment they least want to.
  # The TLS edge in compose.production.yaml answers ACME itself and never reaches this.
  location ^~ /.well-known/ {
    try_files $uri =404;
  }

  # ── dotted paths ──────────────────────────────────────────────────────────────────────────
  #
  # Nothing in dist/ begins with a dot. This refuses the whole class rather than relying on
  # that staying true. /.netlify/functions/ and /.well-known/ are matched by `^~` locations
  # above, and a `^~` win skips regex matching altogether, so this cannot shadow either.
  location ~ /\. {
    access_log off;
    return 404;
  }

  # ── the યુવક app ──────────────────────────────────────────────────────────────────────────
  #
  # netlify.toml: `/* → /index.html, status = 200`, after the API and /admin rules. Every route
  # in src/App.jsx — /login, /darshan, /level/4/:activityId/revision, /daily, /leaderboard —
  # is a BrowserRouter path with no file behind it, so a refresh on any of them arrives here.
  #
  # public/_headers: `/` and `/index.html`, max-age=0 must-revalidate, so a deploy is picked
  # up. The same value covers the icons and favicon.svg, which is what Netlify sends for them
  # today (verified above) — they are referenced from the manifest and from index.html by
  # unhashed paths, so a long cache on them is a mark that cannot be changed.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }

  # ── DIFFERS FROM NETLIFY (2 of 2) ─────────────────────────────────────────────────────────
  #
  # X-Content-Type-Options: nosniff is added on every location above; Netlify sends it on none
  # of them. It tells a browser to believe the Content-Type rather than guess, which is safe
  # here because every type is served from nginx's own mime.types plus the .webmanifest entry
  # at the top of this file. It is listed as a difference because it IS one, small as it is.
  #
  # No Content-Security-Policy is set, and that is a decision rather than an omission. This
  # project has none today on either host; the app loads દર્શન artwork from
  # lh3.googleusercontent.com, app icons from Supabase Storage, and embeds YouTube — a policy
  # written here without testing every one of those would break the app in ways that appear
  # only on the screens nobody opened that day. public/_headers makes the same argument about
  # frame-ancestors. docs/DEPLOYMENT.md carries it as a named follow-up, with the origins.
}
