# વર્ણી ધ્યાન — nginx's MAIN configuration. Replaces the packaged /etc/nginx/nginx.conf.
#
# The site's own rules are not here. They are in deploy/nginx.conf, which the last line of the
# http block includes, and which is a line-by-line translation of netlify.toml and
# public/_headers. This file exists for one reason only:
#
#   ════════════════════════════════════════════════════════════════════════════════════════
#   TO LET THE WHOLE SERVER RUN AS AN UNPRIVILEGED USER
#   ════════════════════════════════════════════════════════════════════════════════════════
#
# Alpine's packaged nginx.conf assumes a root master process: it declares `user nginx;`, puts
# the pid file in /run and the temp directories under /var/lib/nginx, none of which uid 1000 can
# write. Starting it as `node` would fail on the pid file before it read a single site rule.
#
# So every writable path is moved to /tmp, and the `user` directive is dropped — it is
# meaningless without root and nginx warns about it on every start, which is exactly the kind of
# noise that trains an operator to ignore startup output.
#
# The two-container layout used nginxinc/nginx-unprivileged, an image that ships these same
# decisions already made. Merging the frontend and backend into one image means starting from
# node:22-alpine instead, so the decisions have to be written out. They are the same ones.

# No `user` directive. See above.

worker_processes auto;

# stderr, not a file. `docker compose logs` is then the whole story and nothing accumulates on
# the VPS's disk; rotation is configured on the Docker daemon (deploy/vps-setup.sh).
error_log /dev/stderr warn;

pid /tmp/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # The packaged map, which is why there is no `types` block anywhere in this deployment: a
  # second `types` block in the same context REPLACES this map rather than extending it, and
  # would serve every .js, .css and .png in both apps as application/octet-stream.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── the writable paths ────────────────────────────────────────────────────────────────────
  #
  # All under /tmp, which is a tmpfs at run time (compose.yaml). nginx creates them at startup
  # if they are missing, and deploy/entrypoint.sh creates them too, because the tmpfs mount
  # replaces whatever the image had at that path.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  # ── logging ───────────────────────────────────────────────────────────────────────────────
  #
  # No request body and no header is logged, by either half of this container. That is not an
  # accident of the default format: /api/login-mobile receives a password on every mobile login
  # and three of the five functions receive `Authorization: Bearer <jwt>`. server/node-server.js
  # makes the same promise on its side and logs method, path, status and duration only.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65;

  # deploy/nginx.conf. `*.conf` deliberately does not match api-proxy.inc, which sits in the
  # same directory but is included from inside three specific locations rather than here.
  include /etc/nginx/http.d/*.conf;
}
